<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار إرسال البريد مباشرة</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-case { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        button { margin: 5px; padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #console { background: #f4f4f4; padding: 15px; border-radius: 5px; margin-top: 20px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>اختبار إرسال البريد مباشرة إلى المالك</h1>
    
    <div class="test-case">
        <h2>بيانات الطبيب الاختبارية:</h2>
        <div>
            <label>الاسم: <input type="text" id="doctorName" value="دكتور اختبار"></label>
        </div>
        <div>
            <label>البريد: <input type="email" id="doctorEmail" value="doctor.test@example.com"></label>
        </div>
        <div>
            <label>الهاتف: <input type="tel" id="doctorPhone" value="0123456789"></label>
        </div>
        <div>
            <label>التخصص: <input type="text" id="doctorSpecialization" value="طب الأسرة"></label>
        </div>
        <div>
            <label>عنوان الطبيب: <input type="text" id="doctorTitle" value="دكتور"></label>
        </div>
        <div>
            <label>رقم الرخصة: <input type="text" id="doctorLicense" value="MED123456"></label>
        </div>
        
        <button onclick="testSendRegistrationEmail()">إرسال بريد التسجيل إلى المالك</button>
    </div>

    <div id="console"></div>

    <script>
        const consoleDiv = document.getElementById('console');
        
        function log(message, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleDiv.appendChild(p);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console[type === 'error' ? 'error' : 'log'](message);
        }

        function testSendRegistrationEmail() {
            log('بدء اختبار إرسال بريد التسجيل إلى المالك...');
            
            const doctorData = {
                name: document.getElementById('doctorName').value,
                email: document.getElementById('doctorEmail').value,
                phone: document.getElementById('doctorPhone').value,
                specialization: document.getElementById('doctorSpecialization').value,
                title: document.getElementById('doctorTitle').value,
                licenseNumber: document.getElementById('doctorLicense').value
            };
            
            // Initialize EmailJS
            emailjs.init('3R6jOm-e7QM3YUCAT');
            
            const approveURL = `http://localhost:5173/owner?approve=${encodeURIComponent(doctorData.email)}`;
            const rejectURL = `http://localhost:5173/owner?reject=${encodeURIComponent(doctorData.email)}`;
            
            const templateParams = {
                to_email: 'aamerblack@gmail.com',
                name: doctorData.name,
                email: doctorData.email,
                phone: doctorData.phone,
                specialization: doctorData.specialization,
                title: doctorData.title,
                licenseNumber: doctorData.licenseNumber,
                date: new Date().toLocaleString('ar-EG'),
                approve_url: approveURL,
                reject_url: rejectURL,
                from_name: 'Clinic Management System'
            };
            
            log('إرسال البريد باستخدام:');
            log(`Service ID: service_54hd7ve`);
            log(`Template ID: template_yk39dej`);
            log(`To: aamerblack@gmail.com`);
            log(`Approve URL: ${approveURL}`);
            log(`Reject URL: ${rejectURL}`);
            
            emailjs.send('service_54hd7ve', 'template_yk39dej', templateParams)
                .then(response => {
                    log('✅ تم إرسال بريد التسجيل إلى المالك بنجاح!', 'success');
                    log('Response: ' + JSON.stringify(response), 'info');
                    log('يرجى التحقق من بريد aamerblack@gmail.com للتحقق من استلام البريد');
                })
                .catch(error => {
                    log('❌ فشل إرسال بريد التسجيل', 'error');
                    log('Error: ' + JSON.stringify(error), 'error');
                    log('التحقق من:');
                    log('1. Service ID: service_54hd7ve');
                    log('2. Template ID: template_yk39dej');
                    log('3. User ID: 3R6jOm-e7QM3YUCAT');
                    log('4. تأكد من وجود القالب في حساب EmailJS');
                    log('5. تأكد من اتصال خدمة Gmail في EmailJS');
                });
        }
    </script>
</body>
</html>
